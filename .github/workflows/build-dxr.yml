name: Build Microsoft DXR Samples

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-dxr.yml'

permissions:
  contents: read

concurrency:
  group: dxr-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout DXR lab
        uses: actions/checkout@v4

      - name: Clone pinned Microsoft DirectX samples
        shell: pwsh
        run: |
          $revision = '213dd4fd4918ea009dd8f35adee1aff1f2ecaba4'
          git clone --depth 1 --branch master https://github.com/microsoft/DirectX-Graphics-Samples.git dxsamples
          if ((git -C dxsamples rev-parse HEAD).Trim() -ne $revision) {
            git -C dxsamples fetch --depth 1 origin $revision
            git -C dxsamples checkout --detach $revision
          }
          $actual = (git -C dxsamples rev-parse HEAD).Trim()
          if ($actual -ne $revision) { throw "Unexpected Microsoft source revision: $actual" }
          Set-Content -Path microsoft-source-revision.txt -Value $actual

      - name: Apply upstream Sakura Release fix
        shell: pwsh
        run: |
          $project = 'dxsamples\Samples\Desktop\D3D12Raytracing\src\D3D12RaytracingSakuraForestSER\D3D12RaytracingSakuraForestSER.vcxproj'
          [xml]$doc = Get-Content -Raw $project
          $ns = New-Object System.Xml.XmlNamespaceManager($doc.NameTable)
          $ns.AddNamespace('msb', 'http://schemas.microsoft.com/developer/msbuild/2003')
          $releaseCondition = "'`$(Configuration)|`$(Platform)'=='Release|x64'"

          $releaseGroup = $doc.SelectSingleNode("//msb:ItemDefinitionGroup[contains(@Condition,'Release|x64')]", $ns)
          if ($null -eq $releaseGroup) { throw 'Sakura Release x64 ItemDefinitionGroup not found.' }
          $cl = $releaseGroup.SelectSingleNode('msb:ClCompile', $ns)
          if ($null -eq $cl) { throw 'Sakura Release x64 ClCompile node not found.' }
          if ($null -eq $cl.SelectSingleNode('msb:LanguageStandard', $ns)) {
            $lang = $doc.CreateElement('LanguageStandard', $ns.LookupNamespace('msb'))
            $lang.InnerText = 'stdcpp17'
            [void]$cl.AppendChild($lang)
          }

          $fx = $doc.SelectSingleNode("//msb:FxCompile[@Include='Raytracing.hlsl']", $ns)
          if ($null -eq $fx) { throw 'Sakura Raytracing.hlsl FxCompile node not found.' }
          $alreadyExcluded = $false
          foreach ($node in $fx.SelectNodes('msb:ExcludedFromBuild', $ns)) {
            if ($node.GetAttribute('Condition') -eq $releaseCondition) { $alreadyExcluded = $true }
          }
          if (!$alreadyExcluded) {
            $excluded = $doc.CreateElement('ExcludedFromBuild', $ns.LookupNamespace('msb'))
            $excluded.SetAttribute('Condition', $releaseCondition)
            $excluded.InnerText = 'true'
            [void]$fx.AppendChild($excluded)
          }
          $doc.Save((Resolve-Path $project))

          [xml]$verify = Get-Content -Raw $project
          $verifyNs = New-Object System.Xml.XmlNamespaceManager($verify.NameTable)
          $verifyNs.AddNamespace('msb', 'http://schemas.microsoft.com/developer/msbuild/2003')
          $releaseExcluded = $verify.SelectNodes("//msb:FxCompile[@Include='Raytracing.hlsl']/msb:ExcludedFromBuild", $verifyNs) | Where-Object { $_.GetAttribute('Condition') -eq $releaseCondition }
          if ($releaseExcluded.Count -ne 1) { throw 'Sakura upstream Release patch verification failed.' }
          Write-Host 'Applied the two effective changes from Microsoft PR #926 to the current Sakura project.'

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v3

      - name: Restore DXR NuGet packages
        shell: pwsh
        run: |
          $root = (Resolve-Path 'dxsamples').Path
          $packageDir = Join-Path $root 'Packages'
          $configs = Get-ChildItem (Join-Path $root 'Samples\Desktop\D3D12Raytracing\src') -Recurse -Filter packages.config
          Write-Host "Found $($configs.Count) packages.config files"
          foreach ($cfg in $configs) {
            Write-Host "Restoring $($cfg.FullName)"
            & nuget restore $cfg.FullName -PackagesDirectory $packageDir -Source https://api.nuget.org/v3/index.json -NonInteractive
            if ($LASTEXITCODE -ne 0) { throw "NuGet restore failed for $($cfg.FullName)" }
          }

      - name: Build all seven tutorial samples Release x64
        shell: pwsh
        run: |
          $base = (Resolve-Path 'dxsamples\Samples\Desktop\D3D12Raytracing\src').Path
          $projects = @(
            'D3D12RaytracingHelloWorld\D3D12RaytracingHelloWorld.vcxproj',
            'D3D12RaytracingSimpleLighting\D3D12RaytracingSimpleLighting.vcxproj',
            'D3D12RaytracingProceduralGeometry\D3D12RaytracingProceduralGeometry.vcxproj',
            'D3D12RaytracingLibrarySubobjects\D3D12RaytracingLibrarySubobjects.vcxproj',
            'D3D12RaytracingHelloShaderExecutionReordering\D3D12RaytracingHelloShaderExecutionReordering.vcxproj',
            'D3D12RaytracingSakuraForestSER\D3D12RaytracingSakuraForestSER.vcxproj',
            'D3D12RaytracingOpacityMicromaps\D3D12RaytracingOpacityMicromaps.vcxproj'
          )
          $summary = @()
          foreach ($relative in $projects) {
            $project = Join-Path $base $relative
            $name = Split-Path (Split-Path $project -Parent) -Leaf
            Write-Host "`n========== BUILD $name =========="
            & msbuild $project /m:1 /t:Rebuild /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
            if ($LASTEXITCODE -ne 0) { throw "$name failed to build (exit $LASTEXITCODE)." }
            $exe = Join-Path (Split-Path $project -Parent) "bin\x64\Release\$name.exe"
            if (!(Test-Path $exe)) { throw "Expected executable not found: $exe" }
            $summary += "SUCCESS $name"
          }
          $summary | Set-Content tutorial-build-summary.txt

      - name: Build advanced RTAO Release x64
        shell: pwsh
        run: |
          $project = (Resolve-Path 'dxsamples\Samples\Desktop\D3D12Raytracing\src\D3D12RaytracingRealTimeDenoisedAmbientOcclusion\D3D12RaytracingRealTimeDenoisedAmbientOcclusion.vcxproj').Path
          & msbuild $project /m:1 /t:Rebuild /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw "RTAO sample failed to build (exit $LASTEXITCODE)." }
          $exe = Join-Path (Split-Path $project -Parent) 'bin\x64\Release\D3D12RaytracingRealTimeDenoisedAmbientOcclusion.exe'
          if (!(Test-Path $exe)) { throw "RTAO executable not found: $exe" }

      - name: Build MiniEngine sample without rebuilding unrelated DXR samples
        shell: pwsh
        run: |
          $src = (Resolve-Path 'dxsamples\Samples\Desktop\D3D12Raytracing\src').Path
          $project = Join-Path $src 'D3D12RaytracingMiniEngineSample\ModelViewer_VS16.vcxproj'
          $solutionDir = "$src\"
          & msbuild $project /m:1 /t:Rebuild /p:Configuration=Release /p:Platform=x64 "/p:SolutionDir=$solutionDir" /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw "MiniEngine sample failed to build (exit $LASTEXITCODE)." }
          $exe = 'dxsamples\Samples\Desktop\D3D12Raytracing\Build\x64\Release\Output\D3D12RaytracingMiniEngineSample\D3D12RaytracingMiniEngineSample.exe'
          if (!(Test-Path $exe)) { throw "MiniEngine executable not found: $exe" }

      - name: Package nine self-contained runnable samples
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Resolve-Path 'dxsamples').Path
          $src = Join-Path $root 'Samples\Desktop\D3D12Raytracing\src'
          $stage = Join-Path $PWD 'DXR-Runnable-Samples'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'Tutorials') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'Advanced') | Out-Null

          function Copy-RuntimeTree([string]$source, [string]$destination) {
            New-Item -ItemType Directory -Force -Path $destination | Out-Null
            foreach ($file in (Get-ChildItem $source -Recurse -File)) {
              $relative = $file.FullName.Substring($source.Length).TrimStart('\')
              if ($relative -match '(^|\\)(bin|obj|\.vs)(\\|$)') { continue }
              if ($file.Extension -in @('.cpp','.vcxproj','.filters','.user','.pdb','.lib','.exp')) { continue }
              if ($file.Name -eq 'packages.config') { continue }
              $target = Join-Path $destination $relative
              New-Item -ItemType Directory -Force -Path (Split-Path $target -Parent) | Out-Null
              Copy-Item $file.FullName $target -Force
            }
          }

          function Write-Launchers([string]$destination, [string]$exeName) {
            $runLines = @(
              '@echo off',
              'cd /d "%~dp0"',
              "start `"`" `"%~dp0$exeName`" %*"
            )
            $diagLines = @(
              '@echo off',
              'cd /d "%~dp0"',
              "echo Running $exeName from:",
              'cd',
              'echo.',
              "`"$exeName`" %*",
              'echo.',
              'echo Exit code: %ERRORLEVEL%',
              'pause'
            )
            Set-Content -Path (Join-Path $destination 'RUN.cmd') -Value $runLines -Encoding ascii
            Set-Content -Path (Join-Path $destination 'RUN_DIAGNOSTIC.cmd') -Value $diagLines -Encoding ascii
          }

          $tutorials = @(
            @{ Folder='01-HelloWorld'; Project='D3D12RaytracingHelloWorld'; Exe='D3D12RaytracingHelloWorld.exe' },
            @{ Folder='02-SimpleLighting'; Project='D3D12RaytracingSimpleLighting'; Exe='D3D12RaytracingSimpleLighting.exe' },
            @{ Folder='03-ProceduralGeometry'; Project='D3D12RaytracingProceduralGeometry'; Exe='D3D12RaytracingProceduralGeometry.exe' },
            @{ Folder='04-LibrarySubobjects'; Project='D3D12RaytracingLibrarySubobjects'; Exe='D3D12RaytracingLibrarySubobjects.exe' },
            @{ Folder='05-HelloSER'; Project='D3D12RaytracingHelloShaderExecutionReordering'; Exe='D3D12RaytracingHelloShaderExecutionReordering.exe' },
            @{ Folder='06-SakuraForestSER'; Project='D3D12RaytracingSakuraForestSER'; Exe='D3D12RaytracingSakuraForestSER.exe' },
            @{ Folder='07-OpacityMicromaps'; Project='D3D12RaytracingOpacityMicromaps'; Exe='D3D12RaytracingOpacityMicromaps.exe' }
          )

          foreach ($sample in $tutorials) {
            $projectDir = Join-Path $src $sample.Project
            $dest = Join-Path (Join-Path $stage 'Tutorials') $sample.Folder
            Copy-RuntimeTree $projectDir $dest
            $out = Join-Path $projectDir 'bin\x64\Release'
            if (!(Test-Path $out)) { throw "Missing project-local output: $out" }
            Copy-Item (Join-Path $out '*') $dest -Recurse -Force
            if (!(Test-Path (Join-Path $dest $sample.Exe))) { throw "Packaged EXE missing: $($sample.Exe)" }
            Write-Launchers $dest $sample.Exe
          }

          # SER samples compile HLSL at runtime. Explicitly place x64 DXC runtime
          # next to them even if an MSBuild target changes its copy behavior.
          $dxcRoot = Get-ChildItem (Join-Path $root 'Packages') -Directory -Filter 'Microsoft.Direct3D.DXC.*' | Sort-Object Name -Descending | Select-Object -First 1
          if ($null -eq $dxcRoot) { throw 'Microsoft.Direct3D.DXC package directory not found.' }
          $dxcFiles = Get-ChildItem $dxcRoot.FullName -Recurse -File | Where-Object { $_.Name -in @('dxcompiler.dll','dxil.dll') -and $_.FullName -match '\\x64\\' }
          foreach ($serFolder in @('05-HelloSER','06-SakuraForestSER')) {
            $dest = Join-Path (Join-Path $stage 'Tutorials') $serFolder
            foreach ($dll in $dxcFiles) { Copy-Item $dll.FullName $dest -Force }
          }

          $rtaoProject = Join-Path $src 'D3D12RaytracingRealTimeDenoisedAmbientOcclusion'
          $rtaoDest = Join-Path (Join-Path $stage 'Advanced') '01-RealTimeDenoisedAmbientOcclusion'
          Copy-RuntimeTree $rtaoProject $rtaoDest
          Copy-Item (Join-Path $rtaoProject 'bin\x64\Release\*') $rtaoDest -Recurse -Force
          $rtaoExe = 'D3D12RaytracingRealTimeDenoisedAmbientOcclusion.exe'
          if (!(Test-Path (Join-Path $rtaoDest $rtaoExe))) { throw 'Packaged RTAO EXE missing.' }
          if (!(Test-Path (Join-Path $rtaoDest 'Assets'))) { throw 'Packaged RTAO Assets folder missing.' }
          Write-Launchers $rtaoDest $rtaoExe

          $miniOut = Join-Path $root 'Samples\Desktop\D3D12Raytracing\Build\x64\Release\Output\D3D12RaytracingMiniEngineSample'
          $miniProject = Join-Path $src 'D3D12RaytracingMiniEngineSample'
          $miniDest = Join-Path (Join-Path $stage 'Advanced') '02-MiniEngine'
          New-Item -ItemType Directory -Force -Path $miniDest | Out-Null
          Copy-Item (Join-Path $miniOut '*') $miniDest -Recurse -Force
          if (Test-Path (Join-Path $miniProject 'Textures')) { Copy-Item (Join-Path $miniProject 'Textures') $miniDest -Recurse -Force }
          $sponzaSource = Join-Path $root 'MiniEngine\ModelViewer\Sponza'
          if (!(Test-Path $sponzaSource)) { throw "Sponza source folder missing: $sponzaSource" }
          Copy-Item $sponzaSource $miniDest -Recurse -Force
          $miniExe = 'D3D12RaytracingMiniEngineSample.exe'
          if (!(Test-Path (Join-Path $miniDest $miniExe))) { throw 'Packaged MiniEngine EXE missing.' }
          if (!(Test-Path (Join-Path $miniDest 'Sponza\sponza.h3d'))) { throw 'Packaged MiniEngine Sponza model missing.' }
          if (!(Test-Path (Join-Path $miniDest 'Textures'))) { throw 'Packaged MiniEngine Textures folder missing.' }
          Write-Launchers $miniDest $miniExe

          Copy-Item microsoft-source-revision.txt (Join-Path $stage 'microsoft-source-revision.txt') -Force
          Copy-Item tutorial-build-summary.txt (Join-Path $stage 'tutorial-build-summary.txt') -Force
          Set-Content -Path (Join-Path $stage 'README-RUN-FIRST.txt') -Encoding utf8 -Value @(
            'Microsoft DirectX Raytracing runnable samples - Release x64',
            '',
            'Do not move an EXE out of its sample folder. Runtime assets are kept beside each EXE.',
            'Launch RUN.cmd. If a sample closes immediately, launch RUN_DIAGNOSTIC.cmd.',
            '',
            'Tutorials: 01 HelloWorld, 02 SimpleLighting, 03 ProceduralGeometry, 04 LibrarySubobjects, 05 HelloSER, 06 SakuraForestSER, 07 OpacityMicromaps',
            'Advanced: 01 RealTimeDenoisedAmbientOcclusion, 02 MiniEngine',
            '',
            'Sakura Release x64 is locally patched with the effective changes from upstream Microsoft PR #926.'
          )

          $checks = @(
            'Tutorials\05-HelloSER\Raytracing.hlsl',
            'Tutorials\05-HelloSER\dxcompiler.dll',
            'Tutorials\06-SakuraForestSER\Raytracing.hlsl',
            'Tutorials\06-SakuraForestSER\dxcompiler.dll',
            'Tutorials\06-SakuraForestSER\trunk.obj',
            'Tutorials\07-OpacityMicromaps\treeModel.bin',
            'Tutorials\07-OpacityMicromaps\jacaranda_tree_leaves_alpha_4k.dds',
            'Advanced\01-RealTimeDenoisedAmbientOcclusion\Assets',
            'Advanced\02-MiniEngine\Sponza\sponza.h3d',
            'Advanced\02-MiniEngine\Textures'
          )
          foreach ($check in $checks) {
            $p = Join-Path $stage $check
            if (!(Test-Path $p)) { throw "Required runtime asset missing: $check" }
            Write-Host "OK  $check"
          }

          $exes = Get-ChildItem $stage -Recurse -Filter *.exe -File
          $exes | ForEach-Object { Write-Host $_.FullName }
          if ($exes.Count -lt 9) { throw "Expected at least 9 sample EXEs, found $($exes.Count)." }

      - name: Upload runnable DXR samples
        uses: actions/upload-artifact@v4
        with:
          name: DXR-Runnable-Samples-Release-x64
          path: DXR-Runnable-Samples/**
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
