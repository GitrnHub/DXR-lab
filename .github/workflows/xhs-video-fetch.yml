name: Temporary XHS video fetch

on:
  push:
    paths:
      - '.github/workflows/xhs-video-fetch.yml'

jobs:
  fetch-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download source video
        shell: bash
        env:
          VIDEO_URL: 'https://sns-video-hw.xhscdn.com/spectrum/1040g3503243348gh6u0043rtn02tsl50dbg1egg'
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-all-errors \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36' \
            -H 'Referer: https://www.xiaohongshu.com/' \
            "$VIDEO_URL" -o video.mp4
          ls -lh video.mp4
          file video.mp4

      - name: Inspect and extract frames
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffprobe -v error -show_format -show_streams -of json video.mp4 > metadata.json
          mkdir -p frames
          ffmpeg -hide_banner -loglevel error -i video.mp4 -vf 'fps=1,scale=960:-2' -q:v 3 frames/frame_%05d.jpg
          printf 'frame_count=' > frame_count.txt
          find frames -type f -name '*.jpg' | wc -l >> frame_count.txt

      - name: Transcribe speech with faster-whisper
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m pip install --quiet faster-whisper
          cat > transcribe.py <<'PY'
          from faster_whisper import WhisperModel
          model = WhisperModel('small', device='cpu', compute_type='int8')
          segments, info = model.transcribe('video.mp4', beam_size=5, vad_filter=True)
          segs = list(segments)
          with open('transcript.txt', 'w', encoding='utf-8') as f:
              f.write(f'language={info.language} probability={info.language_probability:.4f}\n')
              for s in segs:
                  f.write(f'[{s.start:.2f}-{s.end:.2f}] {s.text.strip()}\n')
          def ts(t):
              ms = int(round(t * 1000))
              h, ms = divmod(ms, 3600000)
              m, ms = divmod(ms, 60000)
              sec, ms = divmod(ms, 1000)
              return f'{h:02d}:{m:02d}:{sec:02d},{ms:03d}'
          with open('transcript.srt', 'w', encoding='utf-8') as f:
              for i, s in enumerate(segs, 1):
                  f.write(f'{i}\n{ts(s.start)} --> {ts(s.end)}\n{s.text.strip()}\n\n')
          PY
          python transcribe.py

      - name: Upload analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: xhs-video-analysis
          path: |
            video.mp4
            metadata.json
            frame_count.txt
            frames/
            transcript.txt
            transcript.srt
          if-no-files-found: warn
          retention-days: 1
