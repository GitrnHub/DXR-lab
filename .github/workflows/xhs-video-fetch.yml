name: Temporary XHS video fetch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'xhs-fetch-trigger.txt'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  issues: write

jobs:
  fetch-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download source video
        shell: bash
        env:
          VIDEO_URL: 'https://sns-video-hw.xhscdn.com/spectrum/1040g3503243348gh6u0043rtn02tsl50dbg1egg'
        run: |
          set -euo pipefail
          mkdir -p temp_xhs frames
          curl -L --fail --retry 3 --retry-all-errors \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36' \
            -H 'Referer: https://www.xiaohongshu.com/' \
            "$VIDEO_URL" -o temp_xhs/video.mp4
          ffprobe -v error -show_format -show_streams -of json temp_xhs/video.mp4 > temp_xhs/metadata.json
          ffmpeg -hide_banner -loglevel error -i temp_xhs/video.mp4 -vf 'fps=1,scale=960:-2' -q:v 3 frames/frame_%05d.jpg
          ffmpeg -hide_banner -loglevel error -i temp_xhs/video.mp4 -vf "fps=0.5,scale=480:-2,tile=4x4" -frames:v 20 -q:v 4 temp_xhs/contact_%02d.jpg || true

      - name: Transcribe speech
        shell: bash
        continue-on-error: true
        run: |
          python -m pip install --quiet faster-whisper
          cat > /tmp/transcribe.py <<'PY'
          from faster_whisper import WhisperModel
          m=WhisperModel('small',device='cpu',compute_type='int8')
          segs,info=m.transcribe('temp_xhs/video.mp4',beam_size=5,vad_filter=True)
          with open('temp_xhs/transcript.txt','w',encoding='utf-8') as f:
              f.write(f'language={info.language} probability={info.language_probability:.4f}\n')
              for s in segs:f.write(f'[{s.start:.2f}-{s.end:.2f}] {s.text.strip()}\n')
          PY
          python /tmp/transcribe.py

      - name: Upload analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: xhs-video-analysis
          path: |
            temp_xhs/
            frames/
          retention-days: 1

      - name: Publish run id to issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/issues/2/comments \
            -f body="XHS_FETCH_RUN_ID=${{ github.run_id }} STATUS=${{ job.status }} SHA=${{ github.sha }}"
